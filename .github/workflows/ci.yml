name: CI

on:
  push:
    branches: [main, v3-foundation]
  pull_request:
    branches: [main, v3-foundation]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Validate library (schemas + capability lint)
        run: npm run validate:library

      - name: Routing eval (no regression vs baseline)
        run: npm run eval:routing -- --check

      - name: Example evals (SKIP until runner lands)
        run: node evals/examples/runner-stub.ts

      # CONTRACT.md §6 parity gate: regenerated registry output must equal the
      # committed registry/generated/. Soft-skips until scripts/generate-registry
      # lands (ROADMAP wave 5), then this step becomes a hard drift gate.
      - name: Registry parity (placeholder until compiler lands)
        run: |
          if node -e "process.exit(require('./package.json').scripts['generate:registry'] ? 0 : 1)"; then
            npm run generate:registry -- --check
          else
            echo "::warning::generate:registry script not present yet — parity gate skipped (ROADMAP wave 5)"
          fi
