name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      # Schemas, identity/link integrity, host cross-checks (module exists,
      # MCP registrations == descriptors, input_schema shape, evidence dates,
      # SKILL.md names), capability lint. Explicit so a red library is a
      # named failure, not something buried in `npm test`.
      - name: Validate library (schemas + cross-checks + capability lint)
        run: npm run validate:library

      # Gate: recall@5 non-regression vs the committed baseline; fails on a
      # stale baseline (corpus_size / query_count / corpus_source mismatch).
      - name: Routing eval (no regression vs baseline)
        run: npm run eval:routing -- --check

      # Held-out set: REPORT ONLY (exit 0). Numbers are for humans reading the
      # log; never a tuning target.
      - name: Routing eval — held-out (report only)
        run: npm run eval:routing:heldout

      # Outcome evals, static half only: task YAML + assertion DSL validate,
      # every golden JSONL matches its readable source, fixtures and
      # skills_expected resolve. No engine, no model — the replay itself is
      # nightly work (evals/outcomes/README.md). Needs dist/ (the runner
      # imports the built toolkit like evals/canary does).
      - name: Outcome evals (dry run — schema + golden drift)
        run: npm run build && npm run eval:outcomes -- --dry-run

      # CONTRACT.md §6 parity gate: regenerated registry output must equal the
      # committed registry/generated/ AND the applied root manifests, and every
      # numeric tool/skill claim in the scanned docs must equal counts.json.
      # Unconditional: the compiler exists; a missing script is a failure.
      - name: Registry parity (regenerate == committed, count claims == counts.json)
        run: npm run generate:registry -- --check

  # The CLI on the other platforms and on the oldest Node the package supports
  # (engines.node). The full suite needs Node 22 and runs once, above.
  smoke:
    name: CLI smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: ubuntu-latest
            node: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Version
        run: node dist/bin/summer.js --version

      - name: Tool list (no engine needed)
        run: node dist/bin/summer.js tool --list

      # Warnings (not signed in, no engine) exit 0; a failed check exits 1.
      - name: Doctor
        run: node dist/bin/summer.js doctor --json

      # Signed in against a local stub gateway: one usage line with the
      # documented fields, valid --json output, sender gone within 4 s.
      - name: Usage line
        run: node scripts/usage-line-smoke.mjs

      # macOS only: these tests expect a POSIX host (Windows writes
      # `cmd.exe /c npx` entries and backslash paths on purpose).
      - name: Installer tests (config paths and formats)
        if: matrix.os == 'macos-latest'
        run: npx vitest run src/installer/agent-config.test.ts src/installer/agent-table.test.ts
