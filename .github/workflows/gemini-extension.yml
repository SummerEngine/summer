name: Attach the Gemini extension to the release

# `gemini extensions install https://github.com/SummerEngine/summer` (and the
# Gemini CLI gallery) installs a release's only asset when it has one. The
# repository keeps its skills in library/skills/, where Gemini does not look,
# so each release carries the extension with skills/ at its root
# (scripts/build-gemini-extension.ts). The workflow token uploads it: no secret.
# Runs when a GitHub Release is published, or by hand for an existing tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the extension to (for example v4.1.0)"
        required: true

permissions: {}

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Gemini takes a release's asset only when it is the only one: a release that
      # already has it is left alone, one with other assets is an error.
      - name: Check the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::\"$TAG\" is not a release tag such as v4.1.0."
            exit 1
          fi
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if printf '%s\n' "$assets" | grep -qx "summer-gemini-extension.tar.gz"; then
            echo "$TAG already has summer-gemini-extension.tar.gz; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$assets" ]; then
            echo "::error::$TAG has other assets ($assets). Gemini installs a release asset only when it is the only one."
            exit 1
          fi

      # The script from this workflow's commit, every packaged file from the tag
      # itself, so a release made before the script existed packages as it was.
      # Neither checkout keeps the token in .git/config.
      - name: Checkout the script
        if: steps.release.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          path: tools
          persist-credentials: false

      - name: Checkout the release tag
        if: steps.release.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          path: release
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.release.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Build the extension
        if: steps.release.outputs.skip != 'true'
        run: node tools/scripts/build-gemini-extension.ts "$RUNNER_TEMP/gemini" release

      - name: Attach it to the release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/gemini/summer-gemini-extension.tar.gz" --repo "$GITHUB_REPOSITORY"
