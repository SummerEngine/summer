# Routing eval corpus — real user/agent asks mapped to the library entries that
# SHOULD surface for them.
#
# Rules:
# - `query` is written the way a real user (or a fresh agent relaying a user)
#   actually phrases it. No keyword-stuffed synthetic filler.
# - `expected` are permanent IDs (`skill/<slug>`, `tool/<slug>`, ..., CONTRACT.md
#   §4). Every ID must exist on disk; the runner errors on unknown IDs.
# - Mix kinds deliberately. The runner reports recall@5 per kind, so tool-intent
#   queries (below) keep the kind prior honest: skill routing must not improve
#   by burying tools.
# - Order within `expected` does not matter; recall@5 counts how many expected
#   IDs land in the top 5.
# - `expected_gap: true` marks queries the library genuinely cannot serve today.
#   Those are DATA — the authoring backlog. They are excluded from recall and
#   reported separately. `closest` (optional) names the best partial match so a
#   future entry can be checked against it.
#
# When a gap gets filled: remove `expected_gap`, add the new ID to `expected`,
# and update the baseline (`npm run eval:routing -- --update-baseline`).

queries:
  # ── 2D assets ──────────────────────────────────────────────────────────
  - query: "draw a portrait of my wizard for the dialogue box"
    expected: [skill/character-portrait]
  - query: "show me a few different art styles for the main character before we commit"
    expected: [skill/concept-art]
  - query: "make me a 32x32 pixel art sword icon"
    expected: [skill/pixel-art]
  - query: "I need a seamless stone floor texture"
    expected: [skill/tileable-texture]
  - query: "make a sprite sheet with a walk cycle for my knight"
    expected: [skill/sprite-sheet]
  - query: "generate a whole pack of forest themed 2D assets in one go"
    expected: [skill/create-asset-sheet]
  - query: "import the asset pack we just generated into my scene"
    expected: [skill/instantiate-asset-pack]
  - query: "generate icons and buttons for my menus"
    expected: [skill/ui-graphics]
  - query: "use the progress bar from the widget pack in my HUD"
    expected: [skill/use-widget-asset]
  - query: "give my 3d scene a nice sunset sky"
    expected: [skill/skybox-panorama]

  # ── 3D assets ──────────────────────────────────────────────────────────
