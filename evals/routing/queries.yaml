    expected_gap: true
    closest: skill/design-npc
    note: "No navigation/NavMesh/pathfinding skill exists. design-npc covers behavior, not navigation."
  - query: "add a save and load system"
    expected: []
    expected_gap: true
    note: "No save/serialization skill. High-frequency ask for any game past a prototype."
  - query: "add an inventory system"
    expected: []
    expected_gap: true
    closest: skill/design-mechanic
    note: "No inventory skill; design-mechanic is generic."
  - query: "add dialogue trees so the NPC can give quests"
    expected: []
    expected_gap: true
    closest: skill/design-npc
    note: "design-npc is combat/behavior. No dialogue-system or quest skill."
  - query: "hook up Steam achievements"
    expected: []
    expected_gap: true
    note: "No platform-integration skill (Steamworks, achievements, leaderboards)."
  - query: "make the terrain destructible"
    expected: []
    expected_gap: true
    note: "No destruction/terrain-modification skill."
  - query: "add a minimap"
    expected: []
    expected_gap: true
    closest: skill/ui-basics
    note: "ui-basics covers Control trees; a minimap needs viewport/camera capture patterns it doesn't teach."
  - query: "translate my game into Japanese"
