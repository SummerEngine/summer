  - query: "what's in the scene tree right now"
    expected: [tool/get-scene-tree]
  - query: "bind the space key to a jump action"
    expected: [tool/input-map-bind]
  - query: "show me the errors in the console"
    expected: [tool/get-console]
  - query: "does this script have any compile errors"
    expected: [tool/get-script-errors]
  - query: "import this glb from a url into my project"
    expected: [tool/import-from-url]
  - query: "fabricate this mesh from my bpy script and import the fabricated glb into the scene"
