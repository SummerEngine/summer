  - query: "I want to make a game but I'm not sure what yet"
    expected: [skill/brainstorm-game]
  - query: "start a new empty project called dungeon-crawler"
    expected: [skill/new-project]
  - query: "what templates can I start from"
    expected: [skill/browse-templates]
  - query: "move my project over to my laptop"
    expected: []
    expected_gap: true
    closest: skill/using-summer
    note: Summer Cloud sync was removed (unmaintained research preview); no project-transfer skill exists. Use git or copy the project folder.
  - query: "run it and tell me if it works"
    expected: [skill/play]
  - query: "playtest the feature yourself by driving the live game frame by frame"
