id: skill/character-animation-wiring
kind: skill
version: 1.0.1
summary: Wire a rigged, animated character end to end — inspect real clips and bones, locomotion state machine, method-track events, poses, blend shapes, root motion.
use_when:
  - a rigged GLB or Meshy rig with generated clips is in the scene and needs idle/walk/run wiring with blend times
  - footstep or attack-frame events, head tracking, still poses, blend-shape facial keys, or root motion must be hooked up
  - the user says the character slides while walking, or the GLB has animations but nothing plays
facets:
  lifecycle:
    - build
  domains:
    - animation
    - 3d
  modalities:
    - animation
    - scenes
    - scripts
compatibility:
  engine: ">=4.6"
related:
  tools:
    - tool/run-script
    - tool/api-docs
  skills:
    - skill/animation-tree
    - skill/generate-motion
    - skill/retarget
    - skill/procedural-animation
    - skill/facial-and-lipsync
    - skill/design-npc
    - skill/scene-scripting
    - skill/verifying-scenes
source: official
license: MIT
status: stable
recommended: false
aliases:
  - skills/animation/character-animation-wiring
