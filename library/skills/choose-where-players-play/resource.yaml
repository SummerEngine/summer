id: skill/choose-where-players-play
kind: skill
version: 1.0.0
summary: "Ask where people will play a new game (Summer Games app, desktop/Steam, consoles) before coding; it decides language, renderer, controls and testing."
use_when:
  - starting a new game, before scaffolding or writing code
  - the user asks which platforms the game can run on, or whether to use GDScript or C++
  - the user wants the game on phones, web, Steam or consoles and the stack is not chosen yet
do_not_use_when:
  - producing the actual export builds for already chosen destinations (use export-and-ship)
facets:
  lifecycle:
    - build
  domains:
    - deployment
    - project
    - game-design
  modalities:
    - docs
    - project
compatibility:
  engine: ">=4.6"
related:
  skills:
    - skill/summer-multiplayer
    - skill/make-game
    - skill/export-and-ship
    - skill/host-authoritative-state
    - skill/tune-performance
source: official
license: MIT
status: preview
recommended: true
