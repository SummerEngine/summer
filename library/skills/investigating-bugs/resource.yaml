summary: Systematic investigation of any bug, test failure, or unexpected behavior before proposing fixes.
use_when:
  - encountering any bug, test failure, or unexpected behavior, before proposing fixes
  - the character falls through the floor and nobody knows why — find the root cause before patching
  - a test fails or the game misbehaves and the first guess at the cause is unproven
