id: skill/make-content
kind: skill
version: 1.0.0
summary: "Make a finished, postable video of your game, cut per platform and saved for review."
use_when:
  - "a developer asks for content for their game: a TikTok, Reels or Shorts clip, an X video, a trailer cut or a devlog"
  - "a visible change just landed (a boss, a skin, a level, a rare drop) and a short clip of it would do well on social"
  - "a piece of content came back with a Change note on the team's Today view"
do_not_use_when:
  - "one generated trailer shot with no edit around it (use trailer-shot)"
  - "a scripted story cutscene inside the game (use cinematic-cutscene)"
  - "store page art: key art, covers, icons, screenshots (use store-art)"
facets:
  lifecycle:
    - grow
    - launch
  domains:
    - creator
    - video
  modalities:
    - video
related:
  skills:
    - skill/trailer-shot
    - skill/cinematic-cutscene
    - skill/store-art
  tools:
    - tool/capture-gameplay
source: official
license: MIT
status: stable
recommended: false
