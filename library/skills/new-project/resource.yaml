id: skill/new-project
kind: skill
version: 1.0.4
summary: Create a fresh blank Summer Engine project — asks one question (project name) and runs summer create empty.
use_when:
  - the user wants a fresh blank Summer Engine project — from scratch, blank canvas
  - starting a Summer Engine project with no template, only a name, ready for an empty main scene
do_not_use_when:
  - starting from an existing template — use browse-templates
facets:
  lifecycle:
    - build
  domains:
    - scenes
    - project
  modalities:
    - project
compatibility:
  engine: ">=4.6"
related:
  skills:
    - skill/make-game
source: official
license: MIT
status: stable
recommended: true
aliases:
  - skills/scene-and-project/new-project
