id: skill/persistent-world-save-migrations
kind: skill
version: 1.0.0
summary: "Change a persistent World's save format without losing progress: save versions, migration steps, fixtures and upgrades."
use_when:
  - "changing what a persistent Summer World saves, or the format of its save, after Worlds already exist"
  - "adding a save version to snapshot_schemas or writing a migration step with register_save_migration"
  - "a World upgrade failed with world_save_migration_failed, world_save_migration_missing, world_save_incompatible or world_upgrade_timeout"
  - "adding or running save fixtures under res://summer/save_fixtures"
  - "choosing when Worlds move to a new version: upgrade on next visit, manual, pinned or strict compatibility"
facets:
  lifecycle:
    - build
    - launch
    - support
  domains:
    - multiplayer
    - scripting
  modalities:
    - scripts
compatibility:
  engine: ">=4.6"
related:
  skills:
    - skill/summer-world-saves
    - skill/multiplayer-project
    - skill/multiplayer-publish
    - skill/headless-scripting
source: official
license: MIT
status: preview
recommended: false
