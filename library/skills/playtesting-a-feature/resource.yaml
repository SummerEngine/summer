id: skill/playtesting-a-feature
kind: skill
version: 1.0.4
summary: "Before claiming a gameplay feature done: actually run the game and walk through the feature. Static diagnostics and type checks do not count."
use_when:
  - about to claim a gameplay feature is done, shipped, or working — requires actually running the game and walking through the feature first
  - a feature passes static diagnostics but nobody has actually run the game and exercised it yet
facets:
  lifecycle:
    - build
  domains:
    - agent-workflow
    - verification
  modalities:
    - project
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
recommended: true
aliases:
  - skills/workflow/playtesting-a-feature
