id: skill/release-readiness
kind: skill
version: 1.0.0
summary: "Before releasing a Summer game version, prove players can play it: server starts its authority scene, online join works, progress saves, no fixed Game ID."
use_when:
  - "before uploading, promoting or releasing a new version to players: is it ready to release"
  - "every online join fails with world_start_timeout, or the hosted server's log is empty, while Local Play works"
  - "Summer.initialize fails with game_identity_mismatch: the initialized Game ID does not match hosted runtime context"
  - "checking that a hosted game's server.pck starts the authority scene and not the title screen"
  - "a game release failed for players and the check that would have caught it needs adding"
do_not_use_when:
  - "only producing a local export for a jam or prototype nobody else plays — skill/export-and-ship"
facets:
  lifecycle:
    - launch
    - support
  domains:
    - deployment
    - multiplayer
    - playtest
  modalities:
    - project
    - docs
compatibility:
  engine: ">=4.6"
related:
  skills:
    - skill/multiplayer
    - skill/multiplayer-publish
    - skill/multiplayer-testing
    - skill/multiplayer-project
    - skill/summer-player-data
    - skill/publish-your-game
    - skill/export-and-ship
    - skill/make-game
    - skill/bounded-engine-runs
source: official
license: MIT
status: preview
recommended: false
