id: skill/setup-multiplayer
kind: skill
version: 2.0.0
summary: "Add multiplayer with Summer's netcode: a predicted SummerNetworkBehavior per player, a Spawner and Local Play tests. No Godot RPCs or MultiplayerSynchronizer."
use_when:
  - "adding multiplayer to a Summer game: co-op, versus or a shared world, local or hosted"
  - a solo game needs online or LAN players added
  - "a multiplayer game rubberbands, desyncs or was built with @rpc / MultiplayerSynchronizer and needs moving to Summer's netcode"
facets:
  lifecycle:
    - build
  domains:
    - multiplayer
    - scripting
  modalities:
    - scripts
    - scenes
compatibility:
  engine: ">=4.6"
related:
  skills:
    - skill/peer-to-peer-multiplayer
    - skill/host-authoritative-state
source: official
license: MIT
status: stable
recommended: true
aliases:
  - skills/multiplayer-and-networking/setup-multiplayer
