id: skill/summer-multiplayer
kind: skill
version: 1.0.0
summary: "Build a GDScript multiplayer game on Summer: dedicated authority, typed state groups, validated Commands, player-data saves, Local Play bot tests."
use_when:
  - making a multiplayer or co-op game that players join through Summer (Summer Games app, web, desktop)
