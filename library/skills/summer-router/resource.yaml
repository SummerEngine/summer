id: skill/summer-router
kind: skill
version: 1.0.0
summary: "Summer Router: AI characters (text and realtime voice with tools), speech, transcription and images at runtime, no keys in the build."
use_when:
  - "a character, creature or object should answer free-form player text or speech in a game (guard, shopkeeper, companion, talking flower)"
  - "a voice NPC that does things in the game through tool calls, for example opening a gate when the player says the password"
  - "players talk to a character with their own voice and the character talks back"
  - "speech, transcription or image generation while the game runs"
  - "about to put a model name, a provider SDK or an API key into a game project"
  - "running summer router (setup, character add, push, test, limits, logs, doctor) or handling Summer Router errors such as limit_reached, router_disabled or tool_unhandled"
do_not_use_when:
  - "scripted dialogue trees or enemy behaviour — skill/design-npc"
  - "pre-recorded voice lines made in the editor — skill/voice-line"
facets:
  lifecycle:
    - build
    - launch
  domains:
    - ai
    - npc
    - audio
  modalities:
    - scripts
    - scenes
    - project
compatibility:
  engine: ">=4.6"
related:
  skills:
    - skill/voice-and-mic-permissions
    - skill/design-npc
    - skill/voice-line
    - skill/multiplayer-state
source: official
license: MIT
status: preview
recommended: false
aliases:
  - skill/ai-characters-in-games
  - ai-characters-in-games
