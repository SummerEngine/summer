id: tool/api-job
kind: tool
version: 1.0.0
summary: Read a Summer API job (state, price, assets and file URLs); follow it, save its files on this computer, or cancel it.
use_when:
  - a summer_api_run answered a running job
  - saving a finished Summer API job's files
do_not_use_when:
  - a job from the Summer Engine asset tools (jobs.wait)
facets:
  lifecycle:
    - build
  domains:
    - generate
    - assets
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: preview
aliases:
  - summer_api_job
implementation:
  module: src/mcp/tools/api-tools.ts
  export: registerApiTools
surfaces:
  mcp:
    tool_name: summer_api_job
    remote: true
  cli:
    command: summer api jobs
input_schema:
  type: object
  properties:
    jobId:
      type: string
      minLength: 1
      maxLength: 200
      description: The job id summer_api_run answered.
    wait:
      type: boolean
      description: Follow the job until it finishes (up to about a minute in this call).
    out:
      type: string
      minLength: 1
      description: "A folder on this computer: save the finished job's files there (implies wait)."
    cancel:
      type: boolean
      description: Cancel the job instead.
  required:
    - jobId
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: true
  credentials: true
  publish: false
