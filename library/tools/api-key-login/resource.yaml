id: tool/api-key-login
kind: tool
version: 1.0.0
summary: Get a Summer API key (SUMMER_API_KEY) for this agent with one Allow click from the person; saved on this computer, never shown to the agent.
use_when:
  - the agent needs a Summer API key and none is saved yet
  - the person asked to connect this agent to the Summer API
do_not_use_when:
  - a key is already saved and works (the tool answers ready)
  - the person did not ask for Summer API access
facets:
  lifecycle:
    - build
  domains:
    - generate
    - mcp
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: preview
aliases:
  - summer_api_key_login
implementation:
  module: src/mcp/tools/api-key-tools.ts
  export: registerApiKeyTools
surfaces:
  mcp:
    tool_name: summer_api_key_login
    remote: true
  cli:
    command: summer login --api-key
input_schema:
  type: object
  properties:
    limitUsd:
      type: number
      minimum: 1
      maximum: 10000
      description: The spend limit to suggest on the Allow page, in USD (default 5); the person can change it there.
    fresh:
      type: boolean
      description: Ask for a new key even when one is saved (or a request is already waiting).
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: true
  credentials: true
  publish: false
