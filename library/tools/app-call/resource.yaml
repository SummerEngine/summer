id: tool/app-call
kind: tool
version: 1.0.0
summary: Run one of a Summer App's agent tools inside the person's open app.
use_when:
  - '"nerf the bow using the balance formula in our app"'
  - using logic that lives in an app (a balance formula, an export) while the app is open
do_not_use_when:
  - "plain reads and edits of app data: apps.read_data, apps.write_data"
facets:
  lifecycle:
    - build
  domains:
    - tools
    - ui
compatibility:
  engine: ">=4.6"
related:
  skills:
    - skill/summer-apps
source: official
license: MIT
status: preview
aliases:
  - summer_app_call
implementation:
  module: src/mcp/tools/app-tools.ts
  export: registerAppTools
surfaces:
  mcp:
    tool_name: summer_app_call
    remote: true
input_schema:
  type: object
  properties:
    appId:
      type: string
      format: uuid
      description: The app id from summer_app_create or summer_app_list
    tool:
      type: string
      minLength: 1
      maxLength: 64
      description: The agent tool name from summer_app_tools
    input:
      type: object
      additionalProperties: {}
      default: {}
      description: Input matching the tool's input schema
  required:
    - appId
    - tool
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: true
  credentials: false
  publish: false
