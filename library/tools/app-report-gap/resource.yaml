id: tool/app-report-gap
kind: tool
version: 1.0.0
summary: Report an SDK capability a Summer App needed and did not have, so Summer builds it.
use_when:
  - an app needed to reach a service or engine feature the SDK does not offer
  - an app needs something the Summer Apps SDK cannot do
facets:
  lifecycle:
    - build
  domains:
    - tools
    - ui
compatibility:
  engine: ">=4.6"
related:
  skills:
    - skill/summer-apps
source: official
license: MIT
status: preview
aliases:
  - summer_app_report_gap
implementation:
  module: src/mcp/tools/app-tools.ts
  export: registerAppTools
surfaces:
  mcp:
    tool_name: summer_app_report_gap
    remote: true
input_schema:
  type: object
  properties:
    capability:
      type: string
      minLength: 1
      maxLength: 200
      description: What the app needed, e.g. "read Steam reviews"
    detail:
      type: string
      maxLength: 2000
    method:
      type: string
      maxLength: 100
      description: The SDK method name you wished existed
    appId:
      type: string
      format: uuid
      description: The app id from summer_app_create or summer_app_list
  required:
    - capability
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: true
  credentials: false
  publish: false
