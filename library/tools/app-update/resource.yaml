id: tool/app-update
kind: tool
version: 1.0.0
summary: Rename a Summer App, move it to a folder, or keep, archive or restore it.
use_when:
  - archiving a scratch app you made that the person did not keep
  - '"rename the loot app to Drop tables"'
  - '"keep this app" (status kept)'
facets:
  lifecycle:
    - build
  domains:
    - tools
    - ui
compatibility:
  engine: ">=4.6"
related:
  skills:
    - skill/summer-apps
source: official
license: MIT
status: preview
aliases:
  - summer_app_update
implementation:
  module: src/mcp/tools/app-tools.ts
  export: registerAppTools
surfaces:
  mcp:
    tool_name: summer_app_update
    remote: true
input_schema:
  type: object
  properties:
    appId:
      type: string
      format: uuid
      description: The app id from summer_app_create or summer_app_list
    name:
      type: string
      minLength: 1
      maxLength: 80
    purpose:
      type: string
      maxLength: 280
    status:
      type: string
      enum:
        - scratch
        - kept
        - archived
      description: "kept: the team keeps it. archived: hidden from the app list (restore with scratch or kept)"
    folder:
      type:
        - string
        - "null"
      minLength: 1
      maxLength: 80
      description: null takes it out of its folder
  required:
    - appId
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: true
  credentials: false
  publish: false
