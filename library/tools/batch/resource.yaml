id: tool/batch
kind: tool
version: 1.1.0
summary: Run engine ops in one call, verbatim; one undo step unless single-only ops split it. ReparentNode keeps and verifies its subtree; raw ConnectSignal is refused.
use_when:
  - multi-node builds that should undo as one step (no single-only ops in the list)
  - reaching engine ops that have no dedicated tool
  - placing many kit pieces, one InstantiateScene op per piece with its position and rotation, read back with receipt summary
do_not_use_when:
  - you need the whole list to be exactly one undo step but it contains a single-only op (the engine splits it; expect one undo step per chunk)
  - connecting a signal — a raw ConnectSignal is refused; use summer_connect_signal
facets:
  lifecycle:
    - build
  domains:
    - scenes
    - editor
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_batch
implementation:
  module: src/mcp/tools/scene-tools.ts
  export: registerSceneTools
surfaces:
  mcp:
    tool_name: summer_batch
    remote: false
input_schema:
  type: object
  properties:
    scenePath:
      type: string
      description: Required when ops contains scene mutations; exact res:// target scene path
    ops:
      type: array
      items:
        type: object
        additionalProperties: {}
      description: Array of operation objects, each with 'op' plus its parameters. InstantiateScene ops may also carry position, rotation_degrees, scale or transform; the tool sets them on the created node. Each InstantiateScene is its own engine request; the transforms of a run of them travel together before the next other op, so N placed pieces plus the save cost about N + 2 requests.
    receipt:
      type: string
      enum: [full, summary]
      description: "full (default): every engine receipt. summary: counts, failures with their op index, created node paths only (under 5 KB)."
  required:
    - ops
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: true
  network: false
  credentials: false
  publish: false
evidence_checks:
  - scene-valid
