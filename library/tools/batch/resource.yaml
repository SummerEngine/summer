id: tool/batch
kind: tool
version: 1.0.0
summary: Run multiple engine ops as one undo group, forwarded verbatim; also the path to raw ops
  with no dedicated tool.
use_when:
  - multi-node builds that should undo as one step
  - reaching engine ops that have no dedicated tool
facets:
  lifecycle:
    - build
  domains:
    - scene
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_batch
implementation:
  module: src/mcp/tools/scene-tools.ts
  export: registerSceneTools
surfaces:
  mcp:
    tool_name: summer_batch
input_schema:
  type: object
  properties:
    scenePath:
      type: string
      description: Required when ops contains scene mutations; exact res:// target scene path
    ops:
      type: array
      items:
        type: object
        additionalProperties: {}
      description: Array of operation objects, each with 'op' plus its parameters
  required:
    - ops
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: true
  network: false
  credentials: false
  publish: false
evidence_checks:
  - scene-valid
