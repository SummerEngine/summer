id: tool/camera-visibility
kind: tool
version: 1.0.0
summary: Read-only check of how up to 5 subjects are framed by one Camera3D at an explicit aspect — frustum, screen rect, coverage, and sampled occlusion rays.
use_when:
  - verifying a framing after summer_frame_camera or a manual camera move
  - checking whether a prop, NPC, or landmark is hidden behind geometry from the player camera
do_not_use_when:
  - you need pixel-accurate visibility or transparent-material handling — summer_screenshot from that camera
  - you want the camera moved — summer_frame_camera
facets:
  lifecycle:
    - build
  domains:
    - scenes
    - 3d
    - world-building
    - camera
    - verification
  modalities:
    - scenes
compatibility:
  engine: ">=4.6"
related:
  tools:
    - tool/frame-camera
    - tool/screenshot
    - tool/world-snapshot
  skills:
    - skill/world-building-3d
source: official
license: MIT
status: preview
aliases:
  - summer_camera_visibility
implementation:
  module: src/mcp/tools/spatial-tools.ts
  export: registerSpatialTools
surfaces:
  mcp:
    tool_name: summer_camera_visibility
    remote: false
input_schema:
  type: object
  properties:
    scenePath:
      type: string
      minLength: 1
      maxLength: 512
      description: Exact scene containing the camera and subjects, e.g. 'res://levels/courtyard.tscn'.
    cameraPath:
      type: string
      minLength: 1
      maxLength: 256
      description: Exact Camera3D path relative to the scene root, e.g. './Cameras/MainCamera'.
    subjectPaths:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 256
      minItems: 1
      maxItems: 5
      description: One to five exact subject paths; descendants contribute visible visual bounds and colliders.
    aspect:
      type: number
      exclusiveMinimum: 0
      description: Evaluation viewport width divided by height, e.g. 1.7777778 for 16:9.
    occlusionSamples:
      type: integer
      minimum: 1
      maximum: 5
      default: 5
      description: Physics rays per subject; center plus up to four world-AABB corners.
    collisionMask:
      type: integer
      minimum: 0
      maximum: 4294967295
      default: 4294967295
      description: Godot 3D physics layers treated as possible occluders.
    collideWithAreas:
      type: boolean
      default: false
      description: Whether Area3D nodes can count as occlusion blockers.
  required:
    - scenePath
    - cameraPath
    - subjectPaths
    - aspect
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: false
  credentials: false
  publish: false
