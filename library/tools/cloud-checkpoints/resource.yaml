id: tool/cloud-checkpoints
kind: tool
version: 1.0.0
summary: List local pre-sync checkpoints taken before destructive applies, with
  stamps usable by cloud restore.
use_when:
  - finding a checkpoint stamp to recover unpushed local work
facets:
  lifecycle:
    - build
  domains:
    - cloud
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: preview
aliases:
  - summer_cloud_checkpoints
implementation:
  module: src/core/capabilities/cloud/sync.ts
  export: cloudCheckpoints
surfaces:
  mcp:
    tool_name: summer_cloud_checkpoints
    remote: true
  cli:
    command: summer cloud checkpoints
input_schema:
  type: object
  properties:
    project:
      type: string
      description: Project root path. Defaults to the current working directory.
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: false
  credentials: false
  publish: false
do_not_use_when:
  - Summer Cloud sync is not operational yet — do not rely on it; Summer
    Platform (publish/releases/creator tools) is the wired path
