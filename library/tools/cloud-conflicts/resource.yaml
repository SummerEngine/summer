id: tool/cloud-conflicts
kind: tool
version: 1.0.0
summary: List preserved Summer Cloud conflict sets from concurrent edits, or recover one back into
  the project as a fresh edit.
use_when:
  - after a push or pull reports conflicts and the user must choose what to keep
facets:
  lifecycle:
    - build
  domains:
    - cloud
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_cloud_conflicts
implementation:
  module: src/core/capabilities/cloud/sync.ts
  export: cloudConflicts
surfaces:
  mcp:
    tool_name: summer_cloud_conflicts
    remote: true
  cli:
    command: summer conflicts
input_schema:
  type: object
  properties:
    project:
      type: string
      description: Project root path. Defaults to the current working directory.
    restorePath:
      type: string
      description: Project-relative path to restore from the conflict sets, re-entered as a fresh edit.
    set:
      type: string
      description: Conflict set stamp; defaults to the newest set containing the path.
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: false
  credentials: false
  publish: false
