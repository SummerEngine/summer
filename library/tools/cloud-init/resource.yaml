id: tool/cloud-init
kind: tool
version: 1.0.0
summary: Enable Summer Cloud whole-project sync for a project by writing its git-tracked
  summer-cloud.json binding.
use_when:
  - once per project before the first cloud push
  - forking a project into a new cloud line after deleting the binding
facets:
  lifecycle:
    - build
  domains:
    - cloud
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_cloud_init
implementation:
  module: src/core/capabilities/cloud/sync.ts
  export: cloudInit
surfaces:
  mcp:
    tool_name: summer_cloud_init
    remote: true
  cli:
    command: summer cloud init
input_schema:
  type: object
  properties:
    project:
      type: string
      description: Project root path. Defaults to the current working directory.
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: true
  credentials: false
  publish: false
