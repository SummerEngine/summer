id: tool/cloud-pull
kind: tool
version: 1.0.0
summary: Download Summer Cloud changes into the local project; writes a local checkpoint before any
  destructive apply and preserves conflicts.
use_when:
  - fetching a teammate's changes
  - hydrating a project on a second machine
do_not_use_when:
  - cloud status has not been run first
facets:
  lifecycle:
    - build
  domains:
    - cloud
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_cloud_pull
implementation:
  module: src/core/capabilities/cloud/sync.ts
  export: cloudPull
surfaces:
  mcp:
    tool_name: summer_cloud_pull
    remote: true
  cli:
    command: summer cloud pull
input_schema:
  type: object
  properties:
    project:
      type: string
      description: Project root path. Defaults to the current working directory.
    bootstrap:
      type: string
      enum:
        - keep-cloud
        - keep-local
        - merge
      description: "No-base bootstrap choice when local and cloud both have files: keep-cloud, keep-local,
        or merge. Present the choice to the user."
    adoptPath:
      type: boolean
      description: Accept that the project folder moved and update the recorded path. Only set after
        confirming the move is intentional, not a copy.
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: true
  credentials: false
  publish: false
evidence_checks:
  - sync-receipt
