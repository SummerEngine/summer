id: tool/cloud-restore
kind: tool
version: 1.0.0
summary: Roll a project back to a retained cloud version or a local pre-sync
  checkpoint; returns an extraneous-file list to review.
use_when:
  - recovering an earlier project state after a bad sync or bulk edit
facets:
  lifecycle:
    - build
  domains:
    - cloud
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: preview
aliases:
  - summer_cloud_restore
implementation:
  module: src/core/capabilities/cloud/sync.ts
  export: cloudRestore
surfaces:
  mcp:
    tool_name: summer_cloud_restore
    remote: true
  cli:
    command: summer cloud restore
input_schema:
  type: object
  properties:
    project:
      type: string
      description: Project root path. Defaults to the current working directory.
    version:
      type: integer
      exclusiveMinimum: 0
      description: Cloud version to restore (see summer_cloud_status / version history).
    checkpointStamp:
      type: string
      description: Local checkpoint stamp (see summer_cloud_checkpoints). Use for
        unpushed local-only work.
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: true
  credentials: false
  publish: false
evidence_checks:
  - sync-receipt
do_not_use_when:
  - Summer Cloud sync is not operational yet — do not rely on it; Summer
    Platform (publish/releases/creator tools) is the wired path
