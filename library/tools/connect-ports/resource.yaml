id: tool/connect-ports
kind: tool
version: 1.0.0
summary: Move and turn one piece so its port (a Marker3D or a measured open pipe end) meets another piece's port, facing it — pipes, ducts, gutters. Saves the scene.
use_when:
  - joining a pipe, duct or gutter section end to end with the previous one
  - fitting a bend, funnel or outlet onto a run
  - snapping any two pieces together by named Marker3D anchors
do_not_use_when:
  - mounting a piece on a wall — summer_attach_to_surface
  - putting bounds faces together without ports — summer_place_adjacent
facets:
  lifecycle:
    - build
  domains:
    - scenes
    - 3d
    - world-building
  modalities:
    - scenes
compatibility:
  engine: ">=4.6"
related:
  tools:
    - tool/inspect-asset
    - tool/attach-to-surface
    - tool/measure
  skills:
    - skill/spatial-placement
source: official
license: MIT
status: preview
aliases:
  - summer_connect_ports
implementation:
  module: src/mcp/tools/placement-tools.ts
  export: registerPlacementTools
surfaces:
  mcp:
    tool_name: summer_connect_ports
    remote: false
input_schema:
  type: object
  properties:
    scenePath:
      type: string
      minLength: 1
      maxLength: 512
      description: Exact scene, e.g. 'res://levels/alley.tscn'. It must be open in the editor (any tab).
    subject:
      type: string
      minLength: 1
      maxLength: 256
      description: Piece to move.
    subjectPort:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 128
        - type: integer
          minimum: 0
          maximum: 255
      description: A Marker3D (or Node3D) name under the subject, whose -Z axis points out of the port; or an open-loop index from summer_inspect_asset.
    target:
      type: string
      minLength: 1
      maxLength: 256
      description: Piece that stays put.
    targetPort:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 128
        - type: integer
          minimum: 0
          maximum: 255
      description: Port on the target (marker name or open-loop index).
    gap:
      type: number
      minimum: -1
      maximum: 10
      default: 0
      description: Distance between the ports along the target port's direction.
    rollDegrees:
      type: number
      minimum: -360
      maximum: 360
      default: 0
      description: Extra turn of the subject about the joined port axis.
    maxTriangles:
      type: integer
      minimum: 1000
      maximum: 300000
      default: 60000
      description: Triangle budget per node when ports are open-loop indices.
  required:
    - scenePath
    - subject
    - subjectPort
    - target
    - targetPort
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: true
  network: false
  credentials: false
  publish: false
evidence_checks:
  - scene-valid
