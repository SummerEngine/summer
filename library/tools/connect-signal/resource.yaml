id: tool/connect-signal
kind: tool
version: 1.0.2
summary: Connect a signal between two nodes; the receiver's script must define the target method.
use_when:
  - wiring events like body_entered, pressed, or timeout
  - '"when the button is pressed, call my function"'
  - running code when the player enters an Area3D or a Timer finishes
do_not_use_when:
  - the receiver script does not define the target method yet — write it first with summer_write_file / summer_replace_text
facets:
  lifecycle:
    - build
  domains:
    - scenes
    - editor
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_connect_signal
implementation:
  module: src/mcp/tools/scene-tools.ts
  export: registerSceneTools
surfaces:
  mcp:
    tool_name: summer_connect_signal
    remote: false
input_schema:
  type: object
  properties:
    scenePath:
      type: string
      description: Target scene path, e.g. 'res://main.tscn'
    emitter:
      type: string
      description: Node that fires the signal, e.g. './Player/HitArea'
    signal:
      type: string
      description: Signal name, e.g. 'body_entered'
    receiver:
      type: string
      description: Node with the handler script, e.g. './Player'
    method:
      type: string
      description: Method name in the receiver's script, e.g. '_on_hit_area_body_entered'
  required:
    - scenePath
    - emitter
    - signal
    - receiver
    - method
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: true
  network: false
  credentials: false
  publish: false
evidence_checks:
  - scene-valid
