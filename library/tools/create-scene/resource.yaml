id: tool/create-scene
kind: tool
version: 1.0.0
summary: Create a new minimal .tscn on disk with a create-only guard and read-back verification; never touches the open scene.
use_when:
  - starting a new level, prefab, or UI scene file
facets:
  lifecycle:
    - build
  domains:
    - scene
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_create_scene
implementation:
  module: src/mcp/tools/scene-tools.ts
  export: registerSceneTools
surfaces:
  mcp:
    tool_name: summer_create_scene
    remote: false
input_schema:
  type: object
  properties:
    path:
      type: string
      description: New scene path, e.g. 'res://scenes/empty_level.tscn'
    rootName:
      type: string
      default: Main
      description: Root node name for the new scene
    rootType:
      type: string
      default: Node3D
      description: "Root node type. Default 'Node3D' (3D scenes); common alternatives: 'Node2D' (2D scenes), 'Control' (UI scenes), 'Node' (logic-only)."
    allow_temporary_scene_mutation:
      type: boolean
      description: DEPRECATED, ignored. Scene creation no longer mutates any open scene; kept only so older callers don't break.
  required:
    - path
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: false
  credentials: false
  publish: false
evidence_checks:
  - scene-valid
