id: tool/creator-releases
kind: tool
version: 1.0.2
summary: "Deprecated: lists releases on the legacy creator API. For summer.games use summer_store_releases."
use_when:
  - an old project that published a .pck to the legacy Summercraft creator channel with an sc_ creator token
  - paging legacy creator releases by projectId and cursor
do_not_use_when:
  - what players get on summer.games, or whether a release landed — summer_store_releases
  - publishing a new release — summer_publish_build
facets:
  lifecycle:
    - launch
  domains:
    - creator
    - deployment
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: deprecated
aliases:
  - summer_creator_releases
implementation:
  module: src/core/capabilities/creator.ts
  export: listCreatorReleases
surfaces:
  mcp:
    tool_name: summer_creator_releases
    remote: true
  cli:
    command: summer releases
input_schema:
  type: object
  properties:
    projectId:
      type: string
      description: Creator project ID. Defaults to ~/.summer/config.json.
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
    cursor:
      type: string
      description: Opaque nextCursor from the previous page.
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: true
  credentials: false
  publish: false
