id: tool/export-game
kind: tool
version: 1.0.0
summary: Export the game in the exact file the Summer Games store takes per platform (iPhone, Android, macOS, Windows bundle; web build; desktop download), headless.
use_when:
  - '"export my game for summer.games"'
  - '"make a build I can upload to my store page"'
  - '"export my game for iPhone and Android on Summer Games"'
  - '"make a web build of my game for summer.games"'
  - '"export a Mac or Windows download for my store page"'
  - preparing the bundle that summer_publish_build uploads
do_not_use_when:
  - exporting for Steam, itch.io, the App Store, Google Play or other stores — skill/export-and-ship
  - the game is still being built; export when the user wants a Build
facets:
  lifecycle:
    - launch
  domains:
    - creator
    - deployment
    - headless
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: preview
aliases:
  - summer_export_game
implementation:
  module: src/core/capabilities/export-game.ts
  export: exportGame
surfaces:
  mcp:
    tool_name: summer_export_game
    remote: true
input_schema:
  type: object
  properties:
    project:
      type: string
      description: Project folder with project.godot. Defaults to the MCP's bound project, then the working directory.
    out:
      type: string
      description: Output .zip path. Defaults to <project>/.summer/exports/.
    targets:
      type: array
      items:
        type: string
        enum: [macos, windows, ios, android, web]
      description: "Store platforms. Bundle: any of macos, windows, ios, android (omit to use every platform the project declares). Download: exactly one of web, macos, windows."
    format:
      type: string
      enum: [bundle, download]
      description: 'bundle (default): the summer.games store build. download: a web build or native download; the default when targets is ["web"].'
    debug:
      type: boolean
      default: false
      description: Export a debug build (--export-debug).
    timeoutSeconds:
      type: integer
      minimum: 10
      maximum: 7200
      description: Stop the engine after this many seconds (default 900; a first export imports every asset).
    alignDeclaration:
      type: boolean
      description: A game with a server, set summer.build.json targetPlatforms to targets before exporting. The store refuses an upload whose declaration differs from the exported platforms (declaration_mismatch) and that spends the version.
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: false
  credentials: false
  publish: false
evidence_checks:
  - none
