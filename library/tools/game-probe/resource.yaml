id: tool/game-probe
kind: tool
version: 1.0.0
summary: State AND pixels of one frame of the RUNNING game, atomically — live tree, property reads, and a screenshot stamped with the same frame counters.
use_when:
  - proving what the running game is actually doing before and after an action — the evidence read of every playtest loop
  - '"show me the game right now with the player position" / "screenshot the offscreen instance and read the HUD values"'
  - a claim about motion, spawning, or a state change needs a frame-stamped before/after pair
do_not_use_when:
  - the EDITED scene, not the running game — summer_world_snapshot / summer_screenshot target viewport
  - no game is running (failure_reason game_not_running) — summer_play first
  - "requires an engine build with GameProbe (engine PR #156 follow-up, wave I); on current shipped engines this returns engine_lacks_op — fall back to summer_get_runtime_tree + summer_screenshot target game"
facets:
  lifecycle:
    - build
  domains:
    - runtime
    - playtest
    - verification
  modalities:
    - scenes
    - images
compatibility:
  engine: ">=4.6"
related:
  tools:
    - tool/game-control
    - tool/game-input
    - tool/runtime-set
    - tool/runtime-call
    - tool/get-runtime-tree
    - tool/inspect-runtime-node
    - tool/screenshot
    - tool/play
  skills:
    - skill/agent-playtesting
    - skill/playtesting-a-feature
    - skill/verifying-scenes
source: official
license: MIT
status: preview
aliases:
  - summer_game_probe
implementation:
  module: src/mcp/tools/runtime-tools.ts
  export: registerRuntimeTools
surfaces:
  mcp:
    tool_name: summer_game_probe
    remote: false
input_schema:
  type: object
  properties:
    tree:
      type: object
      description: Include the live scene tree ({name, class, path, children}) built game-side on the SAME frame as the pixels. Omit for no tree.
      properties:
        path:
          type: string
          description: Subtree root, ABSOLUTE runtime path (default the scene tree root).
        depth:
          type: integer
          description: Depth to walk, 1..8 (default 2).
        limit:
          type: integer
          description: Node cap, 1..4000 (default 200); truncated is reported.
      additionalProperties: false
    props:
      type: array
      items:
        type: string
      description: Up to 64 '<absolute path>:<property>' keys read on the same frame, e.g. '/root/Main/Player:position'. Values come back as Godot literal strings; misses land in missing.
    screenshot:
      type: boolean
      description: Capture the game viewport (default true). false = state only, cheaper and works when the window draws nothing.
    max_dim:
      type: integer
      description: Longest image side in pixels, 16..4096 (default 1280); the frame is downscaled to fit.
    instance:
      type: string
      description: Game instance to address (default 'main'). Offscreen instances are named by summer_play with instance + mode offscreen; summer_game_control action 'instances' lists them.
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: false
  credentials: false
  publish: false
evidence_checks:
  - frame-captured
