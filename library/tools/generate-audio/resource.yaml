id: tool/generate-audio
kind: tool
version: 1.1.0
summary: "Generate audio via Summer Studio: text-to-speech, sound effects, music, or multi-voice dialogue."
use_when:
  - creating sound effects, music beds, or spoken lines for the game
  - '"I need a jump sound / a sword swing / a coin pickup"'
  - '"read this dialogue line in a gruff voice" or "background music for the menu"'
do_not_use_when:
  - a .wav/.ogg already exists online — summer_import_from_url
  - the first sound effect in a chat and the person wants to pick between models — summer_generate_sfx_choices
facets:
  lifecycle:
    - build
  domains:
    - generate
    - audio
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_generate_audio
implementation:
  module: src/mcp/tools/generate-tools.ts
  export: registerGenerateTools
surfaces:
  mcp:
    tool_name: summer_generate_audio
    remote: true
input_schema:
  type: object
  properties:
    capability:
      type: string
      description: "Type of audio: text_to_speech, sound_effects, music, text_to_dialogue"
    text:
      type: string
      description: Text for TTS, or description for sound effects
    prompt:
      type: string
      description: Music description (for 'music' capability)
    voiceId:
      type: string
      description: ElevenLabs voice ID for TTS
    modelId:
      type: string
      description: "Model id. text_to_speech: an ElevenLabs model (e.g. 'eleven_multilingual_v2'). sound_effects: eleven_text_to_sound_v2, sonilo-sfx-1.1 or stable-audio-3-sfx; omit to use the person's approved default"
    durationSeconds:
      type: number
      description: Duration in seconds for SFX or music
    loop:
      type: boolean
      description: "sound_effects only: ask for a seamless loop (eleven_text_to_sound_v2 only)"
    inputs:
      type: array
      items:
        type: object
        properties:
          text:
            type: string
          voiceId:
            type: string
        required:
          - text
          - voiceId
        additionalProperties: false
      description: Dialogue lines for text_to_dialogue
    options:
      type: object
      additionalProperties: {}
      description: Provider params, spread at the SDK's top level. Voice tuning goes in options.voiceSettings with camelCase keys (stability, similarityBoost, style, speed, useSpeakerBoost); flat snake_case is silently ignored.
  required:
    - capability
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: true
  credentials: false
  publish: false
evidence_checks:
  - asset-created
