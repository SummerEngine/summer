id: tool/generate-image
kind: tool
version: 1.0.3
summary: Generate or edit an image with allowlisted AI models via Summer Studio; supports text-to-image, image-to-image, and optional background removal.
use_when:
  - creating concept art, textures, or sprites from a prompt
  - transforming an existing image given a reference URL
facets:
  lifecycle:
    - build
  domains:
    - generate
    - 2d
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_generate_image
implementation:
  module: src/mcp/tools/generate-tools.ts
  export: registerGenerateTools
surfaces:
  mcp:
    tool_name: summer_generate_image
    remote: true
input_schema:
  type: object
  properties:
    prompt:
      type: string
      description: Description of the image to generate
    model:
      type: string
      default: nano-banana-2
      description: Model name or full provider ID
    style:
      type: string
      default: realistic
      description: "Style preset: realistic, cartoon, anime, or 'none' to skip"
    referenceImageUrl:
      type: string
      description: Source image URL for img2img / edit mode. The prompt describes how to transform this image.
    removeBackground:
      type: boolean
      description: Remove the background server-side and return an alpha PNG for sprites, icons, or isolated objects.
    aspectRatio:
      type: string
      enum: ["1:1", "16:9", "9:16", "4:3", "3:4", "3:2", "2:3", "5:4", "4:5", "21:9"]
      description: Aspect ratio of the output (default 1:1). The result reports the real width and height.
    width:
      type: integer
      minimum: 64
      maximum: 4096
      description: Smallest output width in pixels; pass with height. 1920 with height 1080 for store key art, 1080 with 1920 for a tall cover.
    height:
      type: integer
      minimum: 64
      maximum: 4096
      description: Smallest output height in pixels; pass with width.
    options:
      type: object
      additionalProperties: {}
      description: Extra model params (seed, negative_prompt, ...). The result lists any it did not use in ignoredOptions.
  required:
    - prompt
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: true
  credentials: false
  publish: false
evidence_checks:
  - asset-created
