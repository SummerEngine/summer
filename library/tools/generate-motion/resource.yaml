id: tool/generate-motion
kind: tool
version: 1.1.0
summary: Generate animation clips for a rigged model — curated humanoid mocap by name, or text-to-motion on any of your own rigs; costs credits, so confirm first.
use_when:
  - adding idle, walk, run, or combat clips to a rigged character
  - '"make my character walk / run / swing a sword"'
  - '"I need an idle animation for the rigged NPC"'
  - a custom action the curated library lacks — nod, bow, shrug, wave with the right arm
  - animating a non-humanoid rig — a talking flower, animal, creature, turret or prop
do_not_use_when:
  - the target model is not rigged — rig it first
  - the motion is mechanical (doors, vehicles, cameras) — animate with a script or AnimationPlayer
facets:
  lifecycle:
    - build
  domains:
    - generate
    - animation
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_generate_motion
implementation:
  module: src/mcp/tools/generate-tools.ts
  export: registerGenerateTools
surfaces:
  mcp:
    tool_name: summer_generate_motion
    remote: true
input_schema:
  type: object
  properties:
    rigAssetId:
      type: string
      description: "Asset ID of the rigged 3d_model. meshy-library: a Summer-rigged humanoid (summer_generate_3d with options.rig=true). text-to-motion: any of your own rigged GLB/FBX models"
    backend:
      type: string
      enum:
        - meshy-library
        - text-to-motion
      default: meshy-library
      description: "meshy-library (default): curated humanoid mocap clip by motionName. text-to-motion: custom clips from text prompts on any of your own rigs (humanoid, animal, creature, plant, prop)"
    motionName:
      type: string
      description: "meshy-library only (required there): curated motion name — idle, walk, run, jump, attack, or an exact library name"
    prompt:
      type: string
      minLength: 1
      maxLength: 300
      description: "text-to-motion: one action as a verb phrase, e.g. 'waves hello with the right arm' (1-300 chars). Shorthand for prompts: [prompt]"
    prompts:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 300
      minItems: 1
      maxItems: 8
      description: "text-to-motion: 1-8 actions, one clip each (each 1-300 chars)"
    takes:
      type: integer
      minimum: 1
      maximum: 4
      description: "text-to-motion: variations per prompt, 1-4 (default 1). Every take is a billed clip"
    lockJoints:
      type: array
      items:
        type: string
        minLength: 1
      description: "text-to-motion: bone names held still, e.g. ['Hips','Spine'] for a rooted plant. Never on characters that walk or jump"
    cfgScale:
      type: number
      minimum: 1.5
      maximum: 8
      description: "text-to-motion: prompt adherence 1.5-8 (default 3); 5 for bigger, clearer gestures on stylized rigs"
    idempotencyKey:
      type: string
      description: Stable retry key so the same logical request is not billed or queued twice
    wait:
      type: boolean
      default: true
      description: Wait for completion (default true, up to 10 min). Set false to get jobId immediately.
    options:
      type: object
      additionalProperties: {}
      description: Backend-specific passthrough
  required:
    - rigAssetId
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: true
  credentials: false
  publish: false
evidence_checks:
  - job-completed
