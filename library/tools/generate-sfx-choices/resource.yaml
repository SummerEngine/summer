id: tool/generate-sfx-choices
kind: tool
version: 1.0.1
summary: "Make one sound effect with several models and show the versions in Summer Studio; the person approves one or more and that model becomes their default."
use_when:
  - the first sound effect in a chat, after the person said yes to three versions to pick from
  - '"give me a few versions of this sword clash to choose from"'
  - '"compare the sound effect models on this whoosh"'
do_not_use_when:
  - the person already said no to choosing in this chat — summer_generate_audio with no modelId
  - music, speech or dialogue — summer_generate_audio
facets:
  lifecycle:
    - build
  domains:
    - generate
    - audio
compatibility:
  engine: ">=4.6"
related:
  skills:
    - skill/sound-effect
source: official
license: MIT
status: preview
aliases:
  - summer_generate_sfx_choices
implementation:
  module: src/mcp/tools/generate-tools.ts
  export: registerGenerateTools
surfaces:
  mcp:
    tool_name: summer_generate_sfx_choices
    remote: true
input_schema:
  type: object
  properties:
    text:
      type: string
      description: The sound to make, written as a Foley description (what hits what, the attack and the tail, close-mic, dry)
    durationSeconds:
      type: number
      description: Exact length in seconds. One-shots 0.5-2; animation-synced sounds match the animation. stable-audio-3-sfx needs >= 1, sonilo-sfx-1.1 >= 0.5
    loop:
      type: boolean
      description: Ask for a seamless loop (eleven_text_to_sound_v2 only; say 'seamless loop' in text too)
    models:
      type: array
      items:
        type: string
        enum:
          - eleven_text_to_sound_v2
          - sonilo-sfx-1.1
          - stable-audio-3-sfx
      description: "2-4 model ids to compare. Default: eleven_text_to_sound_v2, sonilo-sfx-1.1, stable-audio-3-sfx"
    open:
      type: boolean
      description: "Show the choices page in the browser when no open Studio tab took it. false: no browser, only return the URL"
  required:
    - text
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: true
  credentials: false
  publish: false
evidence_checks:
  - asset-created
