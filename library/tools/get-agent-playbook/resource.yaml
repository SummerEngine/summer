id: tool/get-agent-playbook
kind: tool
version: 1.0.2
summary: "AI-first operating guide for Summer MCP: safe workflow, verification ladder, honesty rules, anti-patterns, and recovery steps."
use_when:
  - at the start of a fresh session, before touching scenes
  - a new chat is about to touch a project it has never seen
  - the agent is unsure of Summer's safety rules or verification ladder
do_not_use_when:
  - mid-task lookups of a specific tool's arguments — read that tool's description instead
facets:
  lifecycle:
    - build
  domains:
    - project
    - agent-workflow
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_get_agent_playbook
implementation:
  module: src/mcp/tools/project-tools.ts
  export: registerProjectTools
surfaces:
  mcp:
    tool_name: summer_get_agent_playbook
    remote: true
input_schema:
  type: object
  properties: {}
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: false
  credentials: false
  publish: false
