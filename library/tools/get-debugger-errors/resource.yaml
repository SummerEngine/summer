id: tool/get-debugger-errors
kind: tool
version: 1.0.0
summary: Read deduplicated runtime errors from the debugger, distinct from console prints; optional
  stack traces.
use_when:
  - the running game hit failures like null references or missing nodes
facets:
  lifecycle:
    - build
  domains:
    - debug
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_get_debugger_errors
implementation:
  module: src/mcp/tools/debug-tools.ts
  export: registerDebugTools
surfaces:
  mcp:
    tool_name: summer_get_debugger_errors
input_schema:
  type: object
  properties:
    max_errors:
      type: number
      default: 50
      description: Max errors to return after dedupe
    include_stack:
      type: boolean
      description: Include stack traces for each error
    include_warnings:
      type: boolean
      default: false
      description: Forward-compat flag — when engine supports it, returns warning bodies in the same call.
        Today the engine ignores it; use summer_get_debugger_warnings instead.
    raw:
      type: boolean
      default: false
      description: Bypass dedupe — return engine output verbatim
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: false
  credentials: false
  publish: false
