id: tool/get-project-context
kind: tool
version: 1.0.0
summary: Bind to the open project and return engine health, project name and path, current and main
  scene, trimmed settings, and memory summary.
use_when:
  - first call in every fresh session, to avoid guessing scene filenames
  - deliberately rebinding after the engine switched projects
facets:
  lifecycle:
    - build
  domains:
    - project
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_get_project_context
implementation:
  module: src/mcp/tools/project-tools.ts
  export: registerProjectTools
surfaces:
  mcp:
    tool_name: summer_get_project_context
input_schema:
  type: object
  properties:
    settingsPrefix:
      type: string
      description: Only return project settings whose key starts with this prefix, e.g. 'audio/' or
        'application/config/'. Omit for the curated default set.
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: false
  credentials: false
  publish: false
