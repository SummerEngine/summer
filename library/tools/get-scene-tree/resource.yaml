id: tool/get-scene-tree
kind: tool
version: 1.0.0
summary: Read a scene's node tree, with explicit depth and limit to avoid the engine's silent
  default truncation.
use_when:
  - inspecting scene structure before or after mutations
facets:
  lifecycle:
    - build
  domains:
    - project
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_get_scene_tree
implementation:
  module: src/mcp/tools/project-tools.ts
  export: registerProjectTools
surfaces:
  mcp:
    tool_name: summer_get_scene_tree
input_schema:
  type: object
  properties:
    scenePath:
      type: string
      description: Exact res:// scene path to inspect
    depth:
      type: integer
      exclusiveMinimum: 0
      description: Maximum tree depth to walk. Engine default is 2 — pass a larger value for deep hierarchies.
    limit:
      type: integer
      exclusiveMinimum: 0
      description: Maximum number of nodes to return. Engine default is 200.
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: false
  credentials: false
  publish: false
