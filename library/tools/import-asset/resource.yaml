id: tool/import-asset
kind: tool
version: 1.0.2
summary: Search the asset library and import the best match into the project in one step, optionally adding 3D models to a scene.
use_when:
  - the user asks to add a kind of asset, like 'add a tree to the scene'
  - '"put a rock / a barrel / a torch in the scene from the library"'
  - '"find me a free chest model and drop it in"'
do_not_use_when:
  - you already know the exact asset id (import by id instead)
  - the asset is at a URL, not in the Summer library — summer_import_from_url
facets:
  lifecycle:
    - build
  domains:
    - assets
    - project
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_import_asset
implementation:
  module: src/mcp/tools/asset-tools.ts
  export: registerAssetTools
surfaces:
  mcp:
    tool_name: summer_import_asset
    remote: false
input_schema:
  type: object
  properties:
    query:
      type: string
      description: What to find, e.g. 'low-poly tree', 'wooden crate'
    parent:
      type: string
      description: Parent node path to add the asset under, e.g. './World'. If omitted, only imports (no scene placement)
    scenePath:
      type: string
      description: Required with parent. Exact res:// target scene path.
    assetType:
      type: string
      enum:
        - 2d_image
        - animation
        - 3d_model
        - audio
        - music
        - all
      default: 3d_model
      description: Preferred asset type
    source:
      type: string
      enum:
        - library
        - my_assets
        - all
      default: all
      description: Where to search before importing
  required:
    - query
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: true
  network: true
  credentials: false
  publish: false
evidence_checks:
  - asset-imported
