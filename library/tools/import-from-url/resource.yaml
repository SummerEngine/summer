id: tool/import-from-url
kind: tool
version: 1.0.0
summary: Download one file from a URL and run Godot's full import pipeline so the asset is
  immediately usable.
use_when:
  - importing a model, texture, or audio file from an external URL
facets:
  lifecycle:
    - build
  domains:
    - project
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_import_from_url
implementation:
  module: src/mcp/tools/project-tools.ts
  export: registerProjectTools
surfaces:
  mcp:
    tool_name: summer_import_from_url
input_schema:
  type: object
  properties:
    url:
      type: string
      description: HTTP(S) URL to download from
    path:
      type: string
      description: Target path in project, e.g. 'res://assets/player.glb'. Auto-inferred from URL if omitted.
  required:
    - url
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: true
  credentials: false
  publish: false
evidence_checks:
  - asset-imported
