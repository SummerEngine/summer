id: tool/import-from-url
kind: tool
version: 1.0.2
summary: Download one file from a URL and run Godot's full import pipeline so the asset is immediately usable.
use_when:
  - importing a model, texture, or audio file from an external URL
  - '"grab this .glb from the link and add it to my project"'
  - '"download this texture from the web into res://"'
do_not_use_when:
  - several files at once — summer_import_from_url_batch
  - searching the Summer library instead of a known URL — summer_import_asset
facets:
  lifecycle:
    - build
  domains:
    - project
    - assets
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_import_from_url
implementation:
  module: src/mcp/tools/project-tools.ts
  export: registerProjectTools
surfaces:
  mcp:
    tool_name: summer_import_from_url
    remote: false
input_schema:
  type: object
  properties:
    url:
      type: string
      description: HTTP(S) URL to download from
    path:
      type: string
      description: Target path in project, e.g. 'res://assets/player.glb'. Auto-inferred from URL if omitted.
  required:
    - url
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: true
  credentials: false
  publish: false
evidence_checks:
  - asset-imported
