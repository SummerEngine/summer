id: tool/input-map-bind
kind: tool
version: 1.0.0
summary: Create an input action if needed and bind keyboard or mouse events to it.
use_when:
  - setting up player controls like jump, move, or interact
facets:
  lifecycle:
    - build
  domains:
    - project
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_input_map_bind
implementation:
  module: src/mcp/tools/project-tools.ts
  export: registerProjectTools
surfaces:
  mcp:
    tool_name: summer_input_map_bind
input_schema:
  type: object
  properties:
    name:
      type: string
      description: Action name, e.g. 'jump', 'move_forward', 'interact'
    events:
      type: array
      items:
        type: object
        additionalProperties: {}
      description: Array of input event objects
  required:
    - name
    - events
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: true
  network: false
  credentials: false
  publish: false
