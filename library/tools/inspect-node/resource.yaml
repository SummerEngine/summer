id: tool/inspect-node
kind: tool
version: 1.0.0
summary: Get every editable property of a node with current values, types, and resource info.
use_when:
  - before modifying a node, to understand its current state
facets:
  lifecycle:
    - build
  domains:
    - scene
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_inspect_node
implementation:
  module: src/mcp/tools/scene-tools.ts
  export: registerSceneTools
surfaces:
  mcp:
    tool_name: summer_inspect_node
    remote: false
input_schema:
  type: object
  properties:
    path:
      type: string
      description: Node path from scene tree, e.g. 'Player', 'World/Enemies/Boss', 'DirectionalLight3D'
  required:
    - path
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: false
  credentials: false
  publish: false
