id: tool/inspect-resource
kind: tool
version: 1.0.2
summary: Get all properties of a resource such as a material, mesh, shape, or environment.
use_when:
  - reading sub-properties that the node inspector only names
  - '"what colour is this material?" / "how big is this collision shape?"'
  - '"what settings does the WorldEnvironment resource have?"'
do_not_use_when:
  - top-level node properties — summer_inspect_node
facets:
  lifecycle:
    - build
  domains:
    - scenes
    - editor
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_inspect_resource
implementation:
  module: src/mcp/tools/scene-tools.ts
  export: registerSceneTools
surfaces:
  mcp:
    tool_name: summer_inspect_resource
    remote: false
input_schema:
  type: object
  properties:
    path:
      type: string
      description: Resource path, e.g. 'res://materials/ground.tres' or 'res://models/player.glb'
  required:
    - path
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: false
  credentials: false
  publish: false
