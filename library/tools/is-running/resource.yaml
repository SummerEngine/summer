id: tool/is-running
kind: tool
version: 1.0.0
summary: Check whether the game is running; returns the active scene path when it is.
use_when:
  - deciding whether to boot, restart, or capture the running game
facets:
  lifecycle:
    - build
  domains:
    - debug
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_is_running
implementation:
  module: src/mcp/tools/debug-tools.ts
  export: registerDebugTools
surfaces:
  mcp:
    tool_name: summer_is_running
input_schema:
  type: object
  properties: {}
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: false
  network: false
  credentials: false
  publish: false
