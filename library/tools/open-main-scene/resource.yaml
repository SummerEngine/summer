id: tool/open-main-scene
kind: tool
version: 1.0.0
summary: Open the project's configured main scene from project settings instead of guessing scene filenames.
use_when:
  - any tool reports that no scene is open
facets:
  lifecycle:
    - build
  domains:
    - project
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_open_main_scene
implementation:
  module: src/mcp/tools/project-tools.ts
  export: registerProjectTools
surfaces:
  mcp:
    tool_name: summer_open_main_scene
    remote: false
input_schema:
  type: object
  properties: {}
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: true
  network: false
  credentials: false
  publish: false
