id: tool/open-scene
kind: tool
version: 1.0.0
summary: Open a scene file in the editor to switch tabs.
use_when:
  - switching the editor to an explicitly known scene path
do_not_use_when:
  - guessing scene filenames (resolve them from project context first)
facets:
  lifecycle:
    - build
  domains:
    - scene
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_open_scene
implementation:
  module: src/mcp/tools/scene-tools.ts
  export: registerSceneTools
surfaces:
  mcp:
    tool_name: summer_open_scene
    remote: false
input_schema:
  type: object
  properties:
    path:
      type: string
      description: Scene path, e.g. 'res://main.tscn' or 'res://levels/level1.tscn'
  required:
    - path
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: true
  network: false
  credentials: false
  publish: false
