id: tool/play
kind: tool
version: 1.0.0
summary: Start the game (main scene or a specific scene) inside Summer Engine's viewport.
use_when:
  - runtime verification after edits
  - the user wants to try the game or one level after a change
  - reproducing a bug that only shows at runtime
do_not_use_when:
  - the game is already running and needs a restart — summer_stop first
  - only checking whether it is running — summer_is_running
facets:
  lifecycle:
    - build
  domains:
    - debug
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_play
implementation:
  module: src/mcp/tools/debug-tools.ts
  export: registerDebugTools
surfaces:
  mcp:
    tool_name: summer_play
    remote: false
input_schema:
  type: object
  properties:
    scene:
      type: string
      description: Scene to run instead of main scene, e.g. 'res://levels/test_level.tscn'
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: true
  network: false
  credentials: false
  publish: false
evidence_checks:
  - is-running
