id: tool/play
kind: tool
version: 1.1.0
summary: Start the game (main scene or a specific scene) inside Summer Engine's viewport, optionally pinned with a seed / fixed_fps for a reproducible playtest.
use_when:
  - runtime verification after edits
  - the user wants to try the game or one level after a change
  - reproducing a bug that only shows at runtime
  - a deterministic, repeatable playtest run — pin the global RNG with seed and the timestep with fixed_fps
do_not_use_when:
  - the game is already running and needs a restart — summer_stop first (a pin cannot reach a process that is already up)
  - only checking whether it is running — summer_is_running
facets:
  lifecycle:
    - build
  domains:
    - debug
    - verification
compatibility:
  engine: ">=4.6"
related:
  skills:
    - skill/playtesting-a-feature
source: official
license: MIT
status: stable
aliases:
  - summer_play
implementation:
  module: src/mcp/tools/debug-tools.ts
  export: registerDebugTools
surfaces:
  mcp:
    tool_name: summer_play
    remote: false
input_schema:
  type: object
  properties:
    scene:
      type: string
      description: Scene to run instead of main scene, e.g. 'res://levels/test_level.tscn'
    seed:
      type: integer
      description: Pin the game's GLOBAL RNG for this launch (child gets --summer-seed <seed>). Pins randi/randf/randi_range/randf_range/randfn, Array.shuffle/pick_random. Does NOT pin RandomNumberGenerator instances, scripts calling randomize(), or wall-clock reads. Omitted = randomized, as always.
    fixed_fps:
      type: integer
      exclusiveMinimum: 0
      description: Fixed timestep for this launch (child gets --fixed-fps <n>) - scene time decouples from the wall clock, the game runs as fast as it renders, frame-count-derived state repeats run to run. Opt-in per launch, never the default.
    time_scale:
      type: number
      exclusiveMinimum: 0
      description: Engine time scale for this launch (child gets --time-scale <f>). Not a determinism pin on its own.
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: true
  network: false
  credentials: false
  publish: false
evidence_checks:
  - is-running
