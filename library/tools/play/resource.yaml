id: tool/play
kind: tool
version: 1.3.0
summary: Start the game quietly (editor keeps tab and focus) — main or a given scene, embedded or offscreen, with pins, or a local multiplayer session (players).
use_when:
  - runtime verification after edits
  - the user wants to try the game or one level after a change
  - reproducing a bug that only shows at runtime
  - a deterministic, repeatable playtest run — pin the global RNG with seed and the timestep with fixed_fps
  - launching a deterministic or parallel offscreen playtest instance (seed, fixed frame rate, named offscreen instance) for the runtime tools to drive
  - testing a Summer multiplayer game on this machine — players:2 (Local Play) runs its authority headless and two clients that join through the game's own Summer.client.join; no account, Docker or extra tools
  - launching while the user works on the same machine — the default (focus omitted or false) sends PlayGame agent:true, so the editor does not switch to the Game tab or grab focus; the game still runs embedded and is visible to the runtime tools
do_not_use_when:
  - the game is already running and needs a restart — summer_stop first (seed/fixed_fps cannot reach a game that is already up)
  - "focus: true unless the user is watching and asked to see the game come up — it launches like the toolbar Play button (Game tab + focus). Quiet play does not hide the game; on engines without the background launch posture a user whose Embed Game on Play is off still gets the game in its own OS window as always, while engines with the posture (0.5.66+) also launch that window with --summer-background so it never takes focus"
  - only checking whether it is running — summer_is_running
  - "instance/mode/deterministic need an engine build with the runtime-control ops (Summer Engine 0.5.66 or newer); older engines return for those parameters engine_lacks_op (plain play still works)"
facets:
  lifecycle:
    - build
  domains:
    - debug
    - runtime
    - verification
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_play
implementation:
  module: src/mcp/tools/debug-tools.ts
  export: registerDebugTools
surfaces:
  mcp:
    tool_name: summer_play
    remote: false
related:
  tools:
    - tool/stop
    - tool/is-running
    - tool/game-probe
    - tool/game-control
    - tool/game-input
  skills:
    - skill/agent-playtesting
    - skill/playtesting-a-feature
input_schema:
  type: object
  properties:
    scene:
      type: string
      description: Scene to run instead of main scene, e.g. 'res://levels/test_level.tscn'
    instance:
      type: string
      description: Name a game instance. 'main' (default) = the editor's embedded game. Any other name with mode 'offscreen' spawns a disposable parallel instance (at most 3) that the runtime tools address by this name.
    mode:
      type: string
      enum:
        - embedded
        - offscreen
      description: "'embedded' (default) plays in the editor; 'offscreen' spawns a hidden child process (requires instance != 'main')."
    deterministic:
      type: boolean
      description: Offscreen only — launch with --fixed-fps 60 --summer-seed <seed> --audio-driver Dummy so the run is reproducible and input replays with seed are accepted.
    seed:
      type: integer
      description: "Pin the game's GLOBAL RNG for this launch (child gets --summer-seed <seed>; default 20260725 when deterministic:true and seed is omitted). Pins randi/randf/randi_range/randf_range/randfn, Array.shuffle/pick_random. Does NOT pin RandomNumberGenerator instances, scripts calling randomize(), or wall-clock reads. Omitted = randomized, as always."
    fixed_fps:
      type: integer
      exclusiveMinimum: 0
      description: "Fixed timestep for this launch (child gets --fixed-fps <n>): scene time decouples from the wall clock, the game runs as fast as it renders, frame-count-derived state repeats run to run, and at_ms input timing / GameStep frames map exactly. Opt-in per launch, never the default."
    time_scale:
      type: number
      exclusiveMinimum: 0
      description: Engine time scale for this launch (child gets --time-scale <f>). Not a determinism pin on its own.
    speed:
      type: number
      description: User time scale applied on session start, (0, 100] — e.g. 0.5 for half speed.
    focus:
      type: boolean
      description: "Default false = QUIET play (PlayGame agent:true): the editor does not switch to the Game tab or grab focus for the embedded game, so the user keeps working. Pass true to launch the way the toolbar Play button does (Game tab + focus) — only when the user is watching and asked to see it. The result echoes agent_quiet:true when honoured; a launch result without it (posture_note) means the engine predates quiet play and most likely took focus."
    players:
      type: integer
      minimum: 0
      maximum: 64
      description: "Local Play for a Summer multiplayer game (engine with Local Play): start the game's authority headless plus this many clients on this machine, each joining through the game's own Summer.client.join. The scenes and queue come from the project's summer.build.json WorldDefinition; no account, Docker or game flags are needed. 0 forces one ordinary run. The result's local_play block lists every process and persona."
    spectators:
      type: integer
      minimum: 0
      description: "Local Play: also start this many spectator clients (only with players)."
    queue:
      type: string
      description: "Local Play: the summer.build.json queue the local World stands in for (default: the first declared queue)."
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: true
  network: false
  credentials: false
  publish: false
evidence_checks:
  - is-running
