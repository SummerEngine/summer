id: tool/project-setting
kind: tool
version: 1.0.2
summary: Set one project.godot setting, like main scene, window size, renderer, or gravity.
use_when:
  - configuring project-level behavior
  - '"make the game start on Level1" — changing the main scene'
  - '"set the resolution / fullscreen / gravity / physics tick rate"'
do_not_use_when:
  - per-node properties — summer_set_prop
  - key bindings — summer_input_map_bind
facets:
  lifecycle:
    - build
  domains:
    - project
    - engine
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_project_setting
implementation:
  module: src/mcp/tools/project-tools.ts
  export: registerProjectTools
surfaces:
  mcp:
    tool_name: summer_project_setting
    remote: false
input_schema:
  type: object
  properties:
    key:
      type: string
      description: Setting key path, e.g. 'application/config/name'
    value:
      type:
        - string
        - number
        - boolean
      description: Setting value
  required:
    - key
    - value
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: true
  network: false
  credentials: false
  publish: false
