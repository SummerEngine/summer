id: tool/projects-create-local
kind: tool
version: 1.0.0
summary: 'Create a project on this computer. Writes a template (3d-basic by default) to a folder, no shell needed. Returns projectPath. Next: projects.open_local.'
use_when:
  - '"make me a game"'
  - '"start a new Summer project"'
  - '"create a 3d project on my computer"'
  - no editor is open and this session has no project (engine_not_running says so)
  - an agent with no shell (Claude Desktop, a chat app) starts a game
do_not_use_when:
  - a plan of concept art on Summer's server - projects.create
  - the folder already holds the project - projects.open_local opens it
  - an agent with a shell - npx -y summer-engine@latest dev installs, creates and opens in one step
facets:
  lifecycle:
    - build
  domains:
    - project
    - editor
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_projects_create_local
implementation:
  module: src/core/capabilities/projects-local.ts
  export: createLocalProject
surfaces:
  mcp:
    tool_name: summer_projects_create_local
    remote: false
input_schema:
  type: object
  properties:
    template:
      type: string
      description: Template slug (docs.search finds them) - 3d-basic (default), empty, 3d-third-person-controller, 2d-platformer, ...
    name:
      type: string
      description: The project's name and folder name. Default my-game (or the template's name).
    dir:
      type: string
      description: The project folder - a new or empty folder, not inside another project; ~ is home. Default <name> next to the session's project, in the session's folder, or in ~/Documents/Summer.
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: true
  credentials: false
  publish: false
evidence_checks:
  - none
