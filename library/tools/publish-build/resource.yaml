id: tool/publish-build
kind: tool
version: 1.0.1
summary: "Upload an export to the creator's store game, confirm-gated: a bundle as a Build with its per-platform checks, or a web or native download."
use_when:
  - '"upload my game to summer.games"'
  - '"publish this build to my store page"'
  - '"put my game online so my friends can play it"'
  - '"release version 1.2.0 of my game"'
  - '"ship this exported build to the live channel"'
  - uploading the .zip from summer_export_game as a new Build
  - uploading a web build or a macOS or Windows download from summer_export_game format download
do_not_use_when:
  - the user has not approved the exact game, file, digest, version and publish choice
  - the game is not exported yet — summer_export_game first
  - store page text, art or price — store.update_listing, store.set_art (hosted, after summer login --store)
  - making the build live — summer_go_live
  - what players get now — store.status
facets:
  lifecycle:
    - launch
  domains:
    - creator
    - deployment
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_publish_build
implementation:
  module: src/core/capabilities/publish-build.ts
  export: publishBuild
surfaces:
  mcp:
    tool_name: summer_publish_build
    remote: true
input_schema:
  type: object
  properties:
    gameId:
      type: string
      description: The store game id (from games.list, or the Studio store page URL). Without it the call fails with game_required and lists your store games, or says why the store did not list them.
    file:
      type: string
      description: Exported .zip. Defaults to the last summer_export_game result.
    clientVersion:
      type: string
      description: Build version, vMAJOR.MINOR.PATCH (e.g. v1.0.0); a new upload needs a new version.
    publish:
      type: boolean
      default: false
      description: "Bundles only: also make the Build available to players once its checks pass. summer_go_live does this, the release and the store page in one step."
    platform:
      type: string
      enum:
        - web
        - macos-universal
        - windows-x64
        - linux-x64
      description: "Web builds and native downloads: the store platform. Defaults to the last export's platform; omit for a store bundle."
    confirm:
      type: boolean
      default: false
      description: Set true only after the user approves the exact upload.
    waitSeconds:
      type: integer
      minimum: 0
      maximum: 1800
      description: How long to wait for Summer to make the Build (default 600). On timeout, call again to keep waiting.
  required:
    - clientVersion
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: true
  credentials: false
  publish: true
evidence_checks:
  - none
