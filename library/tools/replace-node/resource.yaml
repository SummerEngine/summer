id: tool/replace-node
kind: tool
version: 1.0.0
summary: Replace a node with a different type or scene, preserving its tree position and children.
use_when:
  - swapping a placeholder for a prefab or changing a body type
facets:
  lifecycle:
    - build
  domains:
    - scene
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_replace_node
implementation:
  module: src/mcp/tools/scene-tools.ts
  export: registerSceneTools
surfaces:
  mcp:
    tool_name: summer_replace_node
input_schema:
  type: object
  properties:
    scenePath:
      type: string
      description: Target scene path, e.g. 'res://main.tscn'
    path:
      type: string
      description: Node path to replace
    type:
      type: string
      description: New node type, e.g. 'RigidBody3D'
    scene:
      type: string
      description: Scene to replace with, e.g. 'res://enemies/boss.tscn'
  required:
    - scenePath
    - path
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: true
  network: false
  credentials: false
  publish: false
evidence_checks:
  - scene-valid
