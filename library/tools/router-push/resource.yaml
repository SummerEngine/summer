id: tool/router-push
kind: tool
version: 1.0.0
summary: 'Check, then save the project''s Summer Router characters on Summer for the game; never overwrites a Studio edit it has not seen.'
use_when:
- sending ai/characters files to Summer after creating or editing a character
- '"push the characters", "save the guard on Summer"'
do_not_use_when:
- settings, caps or the on/off switch — router.set_settings (cloud, the person approves)
facets:
  lifecycle:
  - build
  domains:
  - ai
  - npc
compatibility:
  engine: '>=4.6'
source: official
license: MIT
status: preview
related:
  skills:
  - skill/summer-router
implementation:
  module: src/core/router/operations.ts
  export: ROUTER_OPERATIONS
surfaces:
  mcp:
    tool_name: summer_router_push
    remote: true
input_schema:
  type: object
  properties:
    characters:
      type: array
      items:
        type: string
      description: 'Character ids (file names in ai/characters/). Default: every character file.'
    force:
      type: boolean
      description: Replace a character that changed on Summer since the last push or pull.
    gameId:
      type: string
      description: 'The game on Summer. Default: SUMMER_GAME_ID, then gameId in summer.build.json.'
    project:
      type: string
      description: 'The folder with project.godot. Default: the MCP''s bound project, then the working directory.'
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: false
  network: true
  credentials: false
  publish: false
evidence_checks:
- none
