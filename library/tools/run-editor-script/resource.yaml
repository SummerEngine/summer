id: tool/run-editor-script
kind: tool
version: 1.0.2
summary: Run an EditorScript `func _run():` in a fresh headless child editor against the on-disk project — the cold path for batch and project-wide jobs.
use_when:
  - re-saving many scenes, sweeping resources, mass import fixes, generating .tres assets, long bakes that should not block the live editor
  - '"re-save every scene after the engine upgrade"'
  - '"fix the import settings on all 200 textures"'
do_not_use_when:
  - work on the currently OPEN scene or anything relying on unsaved live edits — summer_run_script
  - anything needing pixels — the headless child has no renderer
  - "you need checkpoint/rollback or the scene-scripting ctx helpers — that is summer_run_script (RunSceneScript, engine PR #156, preview); RunEditorScript itself ships in current engines"
facets:
  lifecycle:
    - build
  domains:
    - project
    - scripting
  modalities:
    - scripts
compatibility:
  engine: ">=4.6"
related:
  tools:
    - tool/run-script
  skills:
    - skill/scene-scripting
    - skill/headless-scripting
source: official
license: MIT
status: stable
aliases:
  - summer_run_editor_script
implementation:
  module: src/mcp/tools/script-tools.ts
  export: registerScriptTools
surfaces:
  mcp:
    tool_name: summer_run_editor_script
    remote: false
input_schema:
  type: object
  properties:
    source:
      type: string
      description: EditorScript GDScript source with `func _run():`. '@tool' / 'extends EditorScript' are optional — missing lines are prepended and reported in normalizations.
    max_seconds:
      type: number
      description: Time budget in seconds for the child editor (default 120, clamped 15-600). Include boot time — large projects can take 30s+ just to start.
    checkpoint:
      type: boolean
      description: Take a SummerGit checkpoint before the child editor runs. The result confesses (no_rewind_point) when none could be taken.
  required:
    - source
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: true
  network: false
  credentials: false
  publish: false
