id: tool/runtime-call
kind: tool
version: 1.0.0
summary: Call one method on a node in the RUNNING game and get its return value — trigger gameplay code directly instead of waiting for input or timers.
use_when:
  - triggering gameplay code in the running game and reading its answer — take_damage, start_wave, get_velocity
  - '"call take_damage(25) on the boss in the running game" / "what does get_velocity return right now?"'
  - a method's result is the fact you need and no property exposes it
do_not_use_when:
  - a plain property read or write — summer_game_probe props / summer_runtime_set are cheaper
  - no game is running (failure_reason game_not_running) — summer_play first
  - "requires an engine build with CallRuntimeMethod (engine PR #156 follow-up, wave I); on current shipped engines this returns engine_lacks_op"
facets:
  lifecycle:
    - build
  domains:
    - runtime
    - playtest
    - verification
  modalities:
    - scenes
    - scripts
compatibility:
  engine: ">=4.6"
related:
  tools:
    - tool/game-probe
    - tool/runtime-set
    - tool/api-docs
    - tool/play
    - tool/inspect-runtime-node
  skills:
    - skill/agent-playtesting
    - skill/playtesting-a-feature
source: official
license: MIT
status: preview
aliases:
  - summer_runtime_call
implementation:
  module: src/mcp/tools/runtime-tools.ts
  export: registerRuntimeTools
surfaces:
  mcp:
    tool_name: summer_runtime_call
    remote: false
input_schema:
  type: object
  properties:
    path:
      type: string
      description: ABSOLUTE runtime node path, e.g. '/root/Main/Player'.
    method:
      type: string
      description: Method name to call on the node, e.g. 'take_damage', 'get_velocity'.
    args:
      type: array
      items: {}
      description: Positional arguments. JSON scalars, arrays and objects pass as-is; math values as Godot literal strings ('Vector3(0, 1, 0)'). Object and RID arguments are refused (bad_args).
    instance:
      type: string
      description: Game instance to address (default 'main'). Offscreen instances are named by summer_play with instance + mode offscreen; summer_game_control action 'instances' lists them.
  required:
    - path
    - method
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: true
  network: false
  credentials: false
  publish: false
evidence_checks:
  - game-probe
