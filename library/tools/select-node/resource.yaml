id: tool/select-node
kind: tool
version: 1.0.2
summary: Select a node in the editor scene tree and show it in the inspector.
use_when:
  - focusing the user's editor on a specific node
  - highlighting the player in the scene tree so the user can see it
  - showing the user the node whose properties are about to change
do_not_use_when:
  - reading properties — summer_inspect_node; selection changes nothing
facets:
  lifecycle:
    - build
  domains:
    - scenes
    - editor
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_select_node
implementation:
  module: src/mcp/tools/scene-tools.ts
  export: registerSceneTools
surfaces:
  mcp:
    tool_name: summer_select_node
    remote: false
input_schema:
  type: object
  properties:
    nodePath:
      type: string
      description: Node path to select
    scenePath:
      type: string
      description: Open this scene first, then select the node
  required:
    - nodePath
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: true
  network: false
  credentials: false
  publish: false
