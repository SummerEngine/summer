id: tool/set-prop
kind: tool
version: 1.0.0
summary: Set a node property using Godot string syntax for vectors, colors, transforms, and resource class names.
use_when:
  - configuring nodes after adding them
facets:
  lifecycle:
    - build
  domains:
    - scenes
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_set_prop
implementation:
  module: src/mcp/tools/scene-tools.ts
  export: registerSceneTools
surfaces:
  mcp:
    tool_name: summer_set_prop
    remote: false
input_schema:
  type: object
  properties:
    scenePath:
      type: string
      description: Target scene path, e.g. 'res://main.tscn'
    path:
      type: string
      description: Node path, e.g. './World/Player'
    key:
      type: string
      description: Property name, e.g. 'position', 'mesh', 'visible'
    value:
      type:
        - string
        - number
        - boolean
      description: Value in Summer Engine variant-string format for complex types, native JSON for primitives
  required:
    - scenePath
    - path
    - key
    - value
  additionalProperties: false
authority:
  filesystem: true
  editor_mutation: true
  network: false
  credentials: false
  publish: false
evidence_checks:
  - scene-valid
