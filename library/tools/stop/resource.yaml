id: tool/stop
kind: tool
version: 1.0.0
summary: Stop the running game. Does not revert scene edits, undo anything, or save — the editor state is left exactly as it is.
use_when:
  - runtime verification is finished
  - the game must restart to pick up scene or script changes
  - a runaway or frozen playtest needs killing
do_not_use_when:
  - you want to undo scene edits — stopping reverts nothing; use editor undo / summer_batch Undo
  - saving — stopping does not save; summer_save_scene
facets:
  lifecycle:
    - build
  domains:
    - debug
compatibility:
  engine: ">=4.6"
source: official
license: MIT
status: stable
aliases:
  - summer_stop
implementation:
  module: src/mcp/tools/debug-tools.ts
  export: registerDebugTools
surfaces:
  mcp:
    tool_name: summer_stop
    remote: false
input_schema:
  type: object
  properties: {}
  additionalProperties: false
authority:
  filesystem: false
  editor_mutation: true
  network: false
  credentials: false
  publish: false
evidence_checks:
  - game-stopped
