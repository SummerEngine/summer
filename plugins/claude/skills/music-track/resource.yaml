id: skill/music-track
kind: skill
version: 1.0.2
summary: "Generate a music track: game loops of 30s or more with a loop point, or linear cinematic cues."
use_when:
  - generating a looped or cinematic music track — main theme, boss music, title screen, exploration loop, combat track
  - a game has no music yet or needs a new track for a level, a cutscene, or the credits
