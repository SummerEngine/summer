id: skill/scene-scripting
kind: skill
version: 1.2.0
summary: "Build scenes, levels, HUDs and wiring with one editor GDScript (summer_run_script) instead of call chains."
use_when:
  - a scene change needs 3+ related ops or any computed placement — scattering, grids, rings, procedural meshes, geometry helpers, terrain, lighting rigs, keyframe animation, shader FX
  - a 2D level (tilemap paint, bodies, camera limits, parallax), an animated sprite, a HUD or Control tree, a persisted signal connection, an attached script, a prefab, input actions, an autoload, or the main scene should be built in one script
  - an API property/method name must be verified with summer_api_docs before scripting
  - a cold project-wide batch job belongs in summer_run_editor_script
do_not_use_when:
  - a single property tweak — summer_set_prop is cheaper
  - one signal, one input binding, or one project setting — summer_connect_signal, summer_input_map_bind, summer_project_setting are one call each and ship today
  - "the engine build lacks RunSceneScript (Summer Engine 0.5.66 or newer; older engines return engine_lacks_op) — RunEditorScript and RunVerification DO ship today, so fall back to summer_run_editor_script or the scene tools"
  - "the 2D/UI/gameplay-code ctx helpers (Summer Engine 0.5.66 or newer) are missing on the engine — the fallback table in its references/ctx-api.md names what works everywhere"
facets:
  lifecycle:
    - build
  domains:
    - scenes
    - scripting
    - 2d
    - ui
    - agent-workflow
  modalities:
    - scripts
    - scenes
compatibility:
  engine: ">=4.6"
related:
  tools:
    - tool/run-script
    - tool/run-editor-script
    - tool/api-docs
    - tool/world-snapshot
    - tool/snapshot-diff
    - tool/screenshot
    - tool/connect-signal
    - tool/input-map-bind
    - tool/project-setting
    - tool/write-file
    - tool/get-script-errors
  skills:
    - skill/verifying-scenes
    - skill/headless-scripting
    - skill/scene-composition
    - skill/character-animation-wiring
    - skill/ui-basics
    - skill/gdscript-patterns
    - skill/sprite-sheet
    - skill/verification-before-completion
  templates:
    - template/2d-platformer
source: official
license: MIT
status: stable
recommended: true
aliases:
  - skills/workflow/scene-scripting
