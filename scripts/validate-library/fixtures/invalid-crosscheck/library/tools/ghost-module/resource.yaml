id: tool/ghost-module
kind: tool
version: 1.0.0
summary: Cross-check fixture ghost-module.
use_when:
  - testing validator cross-checks
facets:
  lifecycle: [build]
source: official
license: MIT
status: stable
implementation:
  module: src/core/capabilities/does-not-exist.ts
  export: register
surfaces:
  mcp:
    tool_name: summer_ghost
    remote: false
input_schema:
  type: object
  properties:
    node_path:
      type: string
  required: [node_path]

authority:
  filesystem: false
  editor_mutation: false
  network: false
  credentials: false
  publish: false
